name: Export v4.4.16 Integration Source

on:
  push:
    branches:
      - integrate-v4.4.16-custom
    paths:
      - ".github/workflows/export-integration-source.yml"
      - "LastEpoch_Hud/**"
      - "tools/**"
      - "README.md"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: v4.4.16-integration-source
          path: |
            LastEpoch_Hud
            tools
            README.md
