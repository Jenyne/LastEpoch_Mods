# Checks every PR and push to master: C# formatting and the unit tests.
# The mod itself can't build here (it needs the game's Il2Cpp assemblies), so the
# patch-target tests skip; the format check and the Core/locale tests still run.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install CSharpier
        run: dotnet tool install --global csharpier --version 1.3.0

      - name: Check formatting (fix locally with "csharpier format LastEpoch_Hud LastEpoch_Hud.Tests")
        run: csharpier check LastEpoch_Hud LastEpoch_Hud.Tests

      # xUnit v3 test projects are executables; `dotnet run` works on every SDK
      # (`dotnet test` with VSTest is rejected by the runner's .NET 10 SDK).
      - name: Run tests
        run: dotnet run --project LastEpoch_Hud.Tests
